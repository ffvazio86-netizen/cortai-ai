name: Backend tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/backend-mvp

permissions:
  contents: write

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg yt-dlp
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit generated lockfile on the development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/backend-mvp'
        run: |
          if [ -f package-lock.json ] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add npm package lockfile"
            git push origin HEAD:codex/backend-mvp
          fi
      - name: Preserve generated lockfile for reproducible installs
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Run tests
        run: npm test
