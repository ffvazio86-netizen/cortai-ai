name: Backend tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/backend-mvp

permissions:
  contents: write

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install dependencies and generate lockfile
        run: npm install
      - name: Commit generated lockfile to feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add package-lock.json for reproducible installs"
            git push origin HEAD:codex/backend-mvp
          fi
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Run tests
        run: npm test
