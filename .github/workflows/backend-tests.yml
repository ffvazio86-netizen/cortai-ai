name: Backend tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/backend-mvp

permissions:
  contents: read

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg yt-dlp
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preserve generated lockfile for reproducible installs
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Run tests
        run: npm test
