name: Backend tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/backend-mvp

permissions:
  contents: read

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
