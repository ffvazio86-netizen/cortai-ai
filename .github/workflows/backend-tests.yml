name: Backend tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/backend-mvp

permissions:
  contents: read

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
