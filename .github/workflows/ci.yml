name: Cort-AI CI

on:
  push:
    branches:
      - codex/cortai-rebuild-mvp
  pull_request:
    branches:
      - codex/cortai-rebuild-mvp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar lockfile reproduzível
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Salvar package-lock.json na branch de trabalho
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/cortai-rebuild-mvp'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json já está atualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible npm lockfile"
            git push origin HEAD:codex/cortai-rebuild-mvp
          fi

      - name: Instalar FFmpeg para teste de processamento real
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Instalar dependências pelo lockfile
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Verificar inicialização e endpoint de saúde
        run: |
          npm start > /tmp/cortai-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/cortai-health.json; then
              cat /tmp/cortai-health.json
              grep -q '"ok":true' /tmp/cortai-health.json
              exit 0
            fi
            sleep 1
          done

          cat /tmp/cortai-server.log
          echo "O servidor não respondeu ao endpoint /api/health."
          exit 1
